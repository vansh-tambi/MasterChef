<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Chef</title>
    <meta name="description" content="Master Chef transforms ingredients in your fridge and pantry into artisanal, home-cooked recipes with interactive step checklists and scalable quantities." />
    <meta property="og:title" content="Master Chef — Artisanal Recipe Assistant" />
    <meta property="og:description" content="Transform ingredients in your pantry and fridge into artisanal home-cooked meals." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="font-body antialiased min-h-screen transition-colors duration-200">
    <!-- Atmospheric SVG noise grain filter overlay -->
    <svg class="pointer-events-none fixed inset-0 z-50 h-full w-full opacity-[0.035]" aria-hidden="true">
      <filter id="kitchen-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#kitchen-grain)" />
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
